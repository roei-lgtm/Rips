services:
  - type: web
    name: rips-demo
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build
    startCommand: npm run db:migrate && npm run db:seed && npm run start -- --port $PORT
    healthCheckPath: /api/catalog
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: DATABASE_URL
        value: file:./demo.db
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
